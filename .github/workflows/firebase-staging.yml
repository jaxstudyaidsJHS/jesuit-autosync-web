name: Jesuit 2.0 — Firebase security emulator
on:
  pull_request:
    paths:
      - 'cloud/firebase/staging/**'
      - '.github/workflows/firebase-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realtime-db-security:
    name: Firebase staging rules — allow/deny tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Firebase emulator tooling
        run: npm install --no-audit --no-fund
        working-directory: cloud/firebase/staging
      - name: Test authenticated staging rules against actual RTDB emulator
        run: npm test
        working-directory: cloud/firebase/staging
# No Firebase project credentials, service account or production rules deployment.

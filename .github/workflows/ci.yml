name: Jesuit Scoreboards 2.0 — portable CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript protocol and remote safety
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node scripts/check-repository.mjs

  swift-core:
    name: Swift 6 shared core tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check preinstalled Swift toolchain
        run: swift --version
      - name: Compile and test all shared Swift models
        run: swift test --package-path ios/JesuitScoreboardsCore

  go-authority:
    name: Go Mac authority tests and cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mac/authority/go.mod
      - name: Race-test durable clock and commands
        run: go test -race ./...
        working-directory: mac/authority
      - name: Cross-compile macOS prototypes
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/jesuit-authority-arm64 ./cmd/jesuit-authority
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/jesuit-authority-amd64 ./cmd/jesuit-authority
        working-directory: mac/authority
# NO production Netlify/Firebase changes and NO Apple signing here.
# Physical iPhone simulator compilation requires the separate manual macOS workflow.

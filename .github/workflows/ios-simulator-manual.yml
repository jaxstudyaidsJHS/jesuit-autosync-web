name: Jesuit 2.0 — cloud Mac iPhone simulator build
on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-simulator-manual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator:
    name: Xcode — unsigned iPhone simulator build (Intel fallback)
    runs-on: macos-15-intel
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Show cloud Mac environment
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Provision and validate staging client configuration
        env:
          STAGING_PLIST: ${{ secrets.JESUIT_STAGING_GOOGLE_SERVICE_INFO }}
        run: |
          if [ -z "$STAGING_PLIST" ]; then
            echo "::error::Missing JESUIT_STAGING_GOOGLE_SERVICE_INFO repository secret"
            exit 1
          fi
          mkdir -p ios/JesuitScoreboardsApp/Config
          CONFIG=ios/JesuitScoreboardsApp/Config/GoogleService-Info.plist
          printf '%s' "$STAGING_PLIST" > "$CONFIG"
          plutil -lint "$CONFIG"
          test "$(/usr/libexec/PlistBuddy -c 'Print :PROJECT_ID' "$CONFIG")" = "jesuit-scoreboards-2-0-staging"
          test "$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "$CONFIG")" = "org.example.jesuitscoreboards.dev"
          DB_URL="$(/usr/libexec/PlistBuddy -c 'Print :DATABASE_URL' "$CONFIG")"
          test "${DB_URL%/}" = "https://jesuit-scoreboards-2-0-staging-default-rtdb.firebaseio.com"
          echo "Verified staging client configuration"
      - name: Generate iPhone Xcode project
        working-directory: ios/JesuitScoreboardsApp
        run: xcodegen generate --spec project.yml
      - name: Resolve local Swift package
        working-directory: ios/JesuitScoreboardsApp
        run: |
          xcodebuild -resolvePackageDependencies \
            -project JesuitScoreboardsDev.xcodeproj \
            -scheme JesuitScoreboardsDev
      - name: Build iPhone Simulator app (NO SIGNING)
        working-directory: ios/JesuitScoreboardsApp
        run: |
          xcodebuild -project JesuitScoreboardsDev.xcodeproj \
            -scheme JesuitScoreboardsDev \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/JesuitDerivedData" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator artifact
        run: |
          APP="$RUNNER_TEMP/JesuitDerivedData/Build/Products/Debug-iphonesimulator/JesuitScoreboardsDev.app"
          test -d "$APP"
          test -f "$APP/GoogleService-Info.plist"
          /usr/bin/cmp -s "$APP/GoogleService-Info.plist" ios/JesuitScoreboardsApp/Config/GoogleService-Info.plist || { echo "Checking packaged configuration"; test "$(/usr/libexec/PlistBuddy -c 'Print :PROJECT_ID' "$APP/GoogleService-Info.plist")" = "jesuit-scoreboards-2-0-staging"; }
          /usr/bin/ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/JesuitScoreboards2-Simulator-UNSIGNED.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: JesuitScoreboards2-Simulator-UNSIGNED
          path: ${{ runner.temp }}/JesuitScoreboards2-Simulator-UNSIGNED.zip
          if-no-files-found: error
          retention-days: 7
# Simulator-only binary. Not signed, not an IPA, not TestFlight.
# No Firebase, Netlify, or Mac broadcast production permissions.
